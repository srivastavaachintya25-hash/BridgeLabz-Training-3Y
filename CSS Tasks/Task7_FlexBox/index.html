<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cnVubmluZyUyMHNob2VzfGVufDB8fDB8fHww" alt="Running Shoes">
            <span class="discount">20% OFF</span>
            <span class="heart">♡</span>
        </div>

        <div class="details">
            <p class="category">SPORTS SHOES</p>
            <h2>Premium Running Shoes</h2>
            <div class="rating">
                ⭐ ⭐ ⭐ ⭐ ⭐
                <span>(120)</span>
            </div>

            <div class="price">
                ₹1,999
                <del>₹2,499</del>
            </div>
            
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
