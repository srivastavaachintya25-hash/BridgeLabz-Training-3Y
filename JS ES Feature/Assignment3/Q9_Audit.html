
<!DOCTYPE html>
<html>
<head>
    <title>JSON Audit</title>
</head>
<body>
    <h2>JSON Audit</h2>

    <script>
        "use strict";

        const rawData = [
            '{"user":"Alex","age":25}',
            '{"id":2}',
            '{invalid}',
            '{"user":"Mina","age":"22"}'
        ];

        let cleanData = [];
        let errors = [];

        for (let i = 0; i < rawData.length; i++) {
            try {
                let data = JSON.parse(rawData[i]);

                if (data.user === undefined ||
                    data.age === undefined) {
                    throw new Error("Missing user or age");
                }

                cleanData.push(data);
                console.log("Valid entry:", data);

            } catch (error) {
                errors.push({
                    line: i + 1,
                    message: error.message
                });

                console.log(
                    `Error on line ${i + 1}: ${error.message}`
                );
            }
        }

        console.log("Clean data:", cleanData);
        console.log("Errors:", errors);

        let under18 = cleanData.filter(function(user) {
            let age = Number(user.age);
            return Number.isFinite(age) && age < 18;
        });

        console.log("Users under 18:", under18);
    </script>
</body>
</html>
