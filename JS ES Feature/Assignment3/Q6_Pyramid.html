
<!DOCTYPE html>
<html>
<head>
    <title>Pyramid Pattern</title>
</head>
<body>
    <h2>Pyramid Pattern Generator</h2>

    <script>
        "use strict";

        const rows = 5;

        for (let i = 1; i <= rows; i++) {
            let pattern = "";

            for (let j = 1; j <= i; j++) {
                pattern += "* ";
            }

            console.log(pattern);
        }

    </script>
</body>
</html>
