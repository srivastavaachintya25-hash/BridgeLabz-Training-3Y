
<!DOCTYPE html>
<html>
<head>
    <title>Employee Bonus Calculator</title>
</head>
<body>
    <h2>Employee Bonus Calculator</h2>

    <script>
        "use strict";

        const employees = [
            { name: "Amit", salary: "45000", years: "5" },
            { name: "Sara", salary: "38000", years: "2" },
            { name: "Kiran", salary: "52000", years: "7" }
        ];

        try {
            for (let i = 0; i < employees.length; i++) {
                let employee = employees[i];

                if (!employee ||
                    employee.salary === undefined ||
                    employee.years === undefined) {
                    throw new Error("Missing employee details");
                }

                let salary = Number(employee.salary);
                let years = Number(employee.years);

                if (!Number.isFinite(salary) ||
                    !Number.isFinite(years)) {
                    throw new Error("Invalid salary or years");
                }

                let bonus;

                if (years > 3) {
                    bonus = salary * 0.10;
                } else {
                    bonus = salary * 0.05;
                }

                console.log(
                    `Name: ${employee.name}, Salary: ${salary}, Years: ${years}, Bonus: ${bonus}`
                );
            }
        } catch (error) {
            console.log("Error:", error.message);
        }
    </script>
</body>
</html>
