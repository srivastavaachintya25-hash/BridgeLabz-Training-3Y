
<!DOCTYPE html>
<html>
<head>
    <title>Transaction Validator</title>
</head>
<body>
    <h2>Transaction Validator</h2>

    <script>
        "use strict";

        const transactions = [
            { id: 1, amount: 2000 },
            { id: 2, amount: -500 },
            { id: 3 },
            null
        ];

        let valid = [];
        let invalid = [];

        for (let i = 0; i < transactions.length; i++) {
            try {
                let transaction = transactions[i];

                if (transaction === null) {
                    throw new Error("Null transaction");
                }

                if (transaction.id === undefined ||
                    transaction.amount === undefined) {
                    throw new Error("Missing amount or ID");
                }

                if (typeof transaction.amount !== "number" ||
                    !Number.isFinite(transaction.amount)) {
                    throw new Error("Invalid amount");
                }

                if (transaction.amount < 0) {
                    throw new Error("Negative amount");
                }

                valid.push(transaction);
                console.log("Valid:", transaction);

            } catch (error) {
                invalid.push({
                    index: i,
                    reason: error.message
                });

                console.log("Invalid:", error.message);
            }
        }

        console.log("Valid transactions:", valid);
        console.log("Invalid transactions:", invalid);
        console.log("Successful count:", valid.length);
        console.log("Failed count:", invalid.length);

    </script>
</body>
</html>
