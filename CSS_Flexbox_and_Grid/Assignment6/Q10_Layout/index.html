<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="page">

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <article>
            <h2 class="title">Welcome to My Website</h2>

            <div class="boxes">

                <div class="box">
                    <h3>Box 1</h3>
                    <p>First content box.</p>
                </div>

                <div class="box">
                    <h3>Box 2</h3>
                    <p>Second content box.</p>
                </div>

                <div class="box">
                    <h3>Box 3</h3>
                    <p>Third content box.</p>
                </div>

            </div>
        </article>

        <aside>
            <h2>Sidebar</h2>
            <p>Useful links</p>
            <p>Recent posts</p>
            <p>Categories</p>
        </aside>

    </main>

    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</div>

</body>
</html>
