
<!DOCTYPE html>
<html>
<head>
    <title>Ride Sharing Application</title>
</head>
<body>
    <h2>Ride Sharing Application</h2>

    <script>
        class User {
            constructor(name, rating) {
                this.name = name;
                this.rating = rating;
            }
        }

        class Driver extends User {
            constructor(name, rating, vehicle) {
                super(name, rating);
                this.vehicle = vehicle;
            }
        }

        class Trip {
            constructor(fromLocation, toLocation, distance) {
                this.fromLocation = fromLocation;
                this.toLocation = toLocation;
                this.distance = distance;
            }

            calculateFare() {
                if (this.distance == null || this.distance <= 0) {
                    throw new Error("Invalid distance provided!");
                }

                let fare = this.distance * 15;
                return fare;
            }
        }

        let driver = new Driver("Rahul", 4.8, "Swift");

        document.write("Driver: " + driver.name + "<br>");
        document.write("Rating: " + driver.rating + "<br>");
        document.write("Vehicle: " + driver.vehicle + "<br><br>");

        try {
            let trip = new Trip("Mathura", "Agra", 60);

            document.write("From: " + trip.fromLocation + "<br>");
            document.write("To: " + trip.toLocation + "<br>");
            document.write("Distance: " + trip.distance + " KM<br>");
            document.write("Fare: Rs. " + trip.calculateFare());
        }
        catch(error) {
            document.write("Error: " + error.message);
        }
    </script>
</body>
</html>
