
<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Inventory</title>
</head>
<body>
    <h2>E-Commerce Inventory System</h2>

    <script>
        let products = [
            { id: 1, name: "Laptop", category: "Electronics", price: 50000, stock: 5 },
            { id: 2, name: "Mobile", category: "Electronics", price: 20000, stock: 2 },
            { id: 3, name: "Shirt", category: "Clothing", price: 1000, stock: 0 },
            { id: 4, name: "Jeans", category: "Clothing", price: 2000, stock: 10 },
            { id: 5, name: "Mouse", category: "Electronics", price: 500, stock: 3 }
        ];

        function getLowStockProducts() {
            return products.filter(p => p.stock < 5);
        }

        function sortProductsByPrice() {
            return [...products].sort((a, b) => a.price - b.price);
        }

        function calculateTotalInventoryValue() {
            return products.reduce(function(total, p) {
                return total + (p.price * p.stock);
            }, 0);
        }

        function groupByCategory() {
            return products.reduce(function(group, p) {
                if (!group[p.category]) {
                    group[p.category] = [];
                }

                group[p.category].push(p.name);
                return group;
            }, {});
        }

        document.write("<h3>Low Stock Products</h3>");

        getLowStockProducts().forEach(p => {
            document.write(p.name + " - Stock: " + p.stock + "<br>");
        });

        document.write("<h3>Products Sorted By Price</h3>");

        sortProductsByPrice().forEach(p => {
            document.write(p.name + " - Rs. " + p.price + "<br>");
        });

        document.write("<h3>Total Inventory Value</h3>");
        document.write("Rs. " + calculateTotalInventoryValue());

        document.write("<h3>Products Grouped By Category</h3>");

        let groups = groupByCategory();

        for (let category in groups) {
            document.write(category + ": " + groups[category].join(", ") + "<br>");
        }
    </script>
</body>
</html>
