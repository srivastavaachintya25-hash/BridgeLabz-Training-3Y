
<!DOCTYPE html>
<html>
<head>
    <title>Product Discount System</title>
</head>
<body>
    <h2>Product Discount System</h2>

    <script>
        function Product(name, price) {
            this.name = name;
            this.price = price;
        }

        Product.prototype.applyDiscount = function(percent) {
            return this.price - (this.price * percent / 100);
        };

        let p1 = new Product("Laptop", 50000);
        let p2 = new Product("Mobile", 20000);
        let p3 = new Product("Headphones", 3000);

        document.write(p1.name + " Final Price: " + p1.applyDiscount(10) + "<br>");
        document.write(p2.name + " Final Price: " + p2.applyDiscount(20) + "<br>");
        document.write(p3.name + " Final Price: " + p3.applyDiscount(15) + "<br>");

        // Abstraction: user only calls applyDiscount()
        // Internal discount calculation is hidden inside the method.
    </script>
</body>
</html>
