
<!DOCTYPE html>
<html>
<head>
    <title>Employee Inheritance</title>
</head>
<body>
    <h2>Employee Inheritance</h2>

    <script>
        class Employee {
            constructor(name, department) {
                this.name = name;
                this.department = department;
            }

            work() {
                document.write(this.name + " is working in " + this.department + "<br>");
            }
        }

        class Manager extends Employee {
            work() {
                document.write(this.name + " is managing the " + this.department + " department<br>");
            }
        }

        let e1 = new Employee("Rahul", "IT");
        let e2 = new Manager("Aman", "HR");

        e1.work();
        e2.work();

        // Runtime Polymorphism:
        // Same work() method behaves differently for both objects.
    </script>
</body>
</html>
