<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>
<body>

    <h1>Upload Image</h1>

    <form>

        <label>Select an image:</label>

        <input
            type="file"
            name="image"
            accept=".jpg,.png"
            required>

        <p>Only JPG and PNG files are allowed.</p>

        <br>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
