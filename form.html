<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <br>
        <br>
        <label for="name">Name:</label>
        <input id="name" type="text"
        placeholder="Enter your name" name="name">
        <br>
        <br>

        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="Enter your email" name="email">
        <br>
        <br>
        
        <label for="phone">Phone No:</label>
        <input id="phone" type="number" placeholder="Enter your phone number" name="phone">
        <br>
        <br>

        <label for="password">Password:</label>
        <input id="pass" type="password" maxlength="8" placeholder="Enter your password" name="password">
        <br>
        <br>

        <label>Skills:</label>
        <select name=""skills" id="skills" size="1">
            <option value="">Select your skills</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="js">JavaScript</option>
            <option value="python">Python</option>
        </select>
            <br>
            <br>
        <section>
            <label>Gender: </label>
            <input id="male" type="radio" name="gender" value="male">
            <label for="male">Male</label>
            <input id="female" type="radio" name="gender" value="female">
            <label for="female">Female</label>
            <input id="other" type="radio" name="gender" value="other">
            <label for="other">Other</label>
            <br>
            <br>
            <section>
                <label>skills: </label>
                <input id="HTML" type="checkbox" name="skills" value="HTML">
                <label for="HTML">HTML</label>
                <input id="CSS" type="checkbox" name="skills" value="CSS">
                <label for="CSS">CSS</label>
                <input id="JavaScript" type="checkbox" name="skills" value="JavaScript">
                <label for="JavaScript">JavaScript</label>
                <input id="Python" type="checkbox" name="skills" value="Python">
                <label for="Python">Python</label>
                <input id="Java" type="checkbox" name="skills" value="Java">
                <label for="Java">Java</label>
                <input id="C++" type="checkbox" name="skills" value="C++">
                <label for="C++">C++</label>
            </section>
            <br>
            <br>
            <label for="date">Present Date:</label>
            <input id="date" type="date" name="date">
            <br>
            <br>
            <label for="time">Current Time:</label>
            <input id="time" type="time" name="time">
            <br>
            <br>
            <label for="color">Favourite Color:</label>
            <input id="color" type="color" name="color">
            <br>
            <br>
            <label for="range">IQ Range:</label>
            <input id="range" type="range" name="range" min="0">
            <br>
            <br>
            <textarea name="message" id="message" cols="30" rows="5" placeholder="Your Introduction"></textarea>
            <br>
            <br>
            <input type="file" name="file" id="file">
            <br>
            <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
