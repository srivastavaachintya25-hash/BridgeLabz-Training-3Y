
<!DOCTYPE html>
<html>
<head>
    <title>Q9 - Odd Even Analyzer</title>
</head>
<body>
    <h2>Odd-Even Number Analyzer</h2>

    <script>
        let results = [];

        for (let i = 1; i <= 30; i++) {
            if (i % 3 == 0 && i % 5 == 0) {
                results.push(i + " - FizzBuzz");
            } else if (i % 2 == 0) {
                results.push(i + " - Even");
            } else {
                results.push(i + " - Odd");
            }
        }

        console.log(results);
    </script>
</body>
</html>
