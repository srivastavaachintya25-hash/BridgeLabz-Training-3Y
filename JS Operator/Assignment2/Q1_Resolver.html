
<!DOCTYPE html>
<html>
<head>
    <title>Q1 - Salary Calculator</title>
</head>
<body>
    <h2>Scope Conflict Resolver</h2>

    <script>
        let bonus = 5000;

        function calculateSalary(isPermanent) {
            let salary = 40000;

            if (isPermanent == true) {
                salary = salary + bonus;
            }

            console.log("Total Salary: " + salary);
        }

        calculateSalary(true);
        calculateSalary(false);

        bonus = 6000;
        console.log("Global Bonus: " + bonus);
        calculateSalary(true);
    </script>
</body>
</html>
