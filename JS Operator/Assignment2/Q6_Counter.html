
<!DOCTYPE html>
<html>
<head>
    <title>Q6 - Counter</title>
</head>
<body>
    <h2>Event-Based Counter Simulation</h2>

    <script>
        let count = 0;

        function increment() {
            count++;
            console.log("Count: " + count);

            function showCount() {
                console.log("Current Count: " + count);
            }

            showCount();
        }

        function decrement() {
            count--;
            console.log("Count: " + count);
        }

        increment();
        increment();
        decrement();
    </script>
</body>
</html>
