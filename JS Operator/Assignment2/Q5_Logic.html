<body>
    <h2>Boolean Logic Access System</h2>

    <script>
        let isDoorLocked = true;
        let isWindowClosed = true;
        let isAlarmOn = true;
        let isOwnerInside = true;

        if (isAlarmOn && isDoorLocked &&
            isWindowClosed && isOwnerInside) {
            console.log("Secure");
        } else {
            console.log("Unsafe");
        }

        // Test another outcome
        isAlarmOn = false;

        if (isAlarmOn && isDoorLocked &&
            isWindowClosed && isOwnerInside) {
            console.log("Secure");
        } else {
            console.log("Unsafe");
        }

        console.log(isAlarmOn || isOwnerInside);
        console.log(!isDoorLocked);
    </script>
</body>
