
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over images to remove filters.</p>
    </header>

    <main class="gallery">

        <figure class="gallery-item blur">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Mountain">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure class="gallery-item grayscale">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Forest">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure class="gallery-item sepia">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Nature">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure class="gallery-item brightness">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Lake">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure class="gallery-item contrast">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Cabin">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure class="gallery-item hue">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Trees">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>

    </main>

    <footer>Responsive CSS Grid Gallery</footer>

</body>
</html>
