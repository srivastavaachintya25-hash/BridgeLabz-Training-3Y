
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <h1>Before and After Filter</h1>
    </header>

    <main class="comparison">

        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Original mountain image">

            <figcaption>Before: Original Image</figcaption>
        </figure>

        <figure class="filtered">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Filtered mountain image">

            <figcaption>After: Filtered Image</figcaption>
        </figure>

    </main>

</body>
</html>
