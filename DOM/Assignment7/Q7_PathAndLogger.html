
<!DOCTYPE html>
<html>
<head>
    <title>Q7 - Mouse Coordinates</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #mouseBox {
            width: 400px;
            height: 400px;
            border: 3px solid black;
            margin: 20px auto;
            position: relative;
            background-color: #e0f2fe;
        }

        #coordinates {
            font-weight: bold;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <h2>Mouse Coordinates Logger</h2>

    <p id="coordinates">
        Move mouse inside the box
    </p>

    <div id="mouseBox"></div>

    <script>

        let box = document.getElementById("mouseBox");

        let coordinates =
            document.getElementById("coordinates");

        // Track mouse movement
        box.addEventListener("mousemove", function(event) {

            coordinates.textContent =
                "clientX: " + event.clientX +
                " | clientY: " + event.clientY;

        });

        // Add red dot on double click
        box.addEventListener("dblclick", function(event) {

            let rect = box.getBoundingClientRect();

            // Calculate position inside box
            let x = event.clientX - rect.left;

            let y = event.clientY - rect.top;

            // Create red dot
            let dot = document.createElement("div");

            dot.className = "dot";

            dot.style.left = x + "px";

            dot.style.top = y + "px";

            box.appendChild(dot);

        });

    </script>

</body>
</html>
