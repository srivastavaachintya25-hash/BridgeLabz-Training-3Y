
<!DOCTYPE html>
<html>
<head>
    <title>Q3 - Multi Step Form</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .step {
            display: none;
        }

        .active {
            display: block;
        }

        input {
            padding: 10px;
            margin: 10px 0;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h2>Multi-Step Registration Form</h2>

    <!-- Step 1 -->
    <div class="step active" id="step1">

        <h3>Step 1: Name</h3>

        <input type="text" id="name"
               placeholder="Enter your name">

        <br>

        <button onclick="nextStep(1)">Next</button>

    </div>

    <!-- Step 2 -->
    <div class="step" id="step2">

        <h3>Step 2: Email</h3>

        <input type="email" id="email"
               placeholder="Enter your email">

        <br>

        <button onclick="previousStep(2)">Back</button>
        <button onclick="nextStep(2)">Next</button>

    </div>

    <!-- Step 3 -->
    <div class="step" id="step3">

        <h3>Step 3: Password</h3>

        <input type="password" id="password"
               placeholder="Enter password">

        <br>

        <button onclick="previousStep(3)">Back</button>
        <button onclick="submitForm()">Submit</button>

    </div>

    <!-- Final Summary -->
    <div class="step" id="summary">

        <h3>Registration Successful!</h3>

        <p id="result"></p>

    </div>

    <script>

        // Move to next step
        function nextStep(current) {

            let valid = false;

            if (current === 1) {

                let name = document.getElementById("name").value.trim();

                if (name === "") {
                    alert("Please enter your name");
                    return;
                }

                valid = true;
            }

            else if (current === 2) {

                let email = document.getElementById("email").value.trim();

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert("Please enter a valid email");
                    return;
                }

                valid = true;
            }

            if (valid) {
                document.getElementById("step" + current)
                    .classList.remove("active");

                document.getElementById("step" + (current + 1))
                    .classList.add("active");
            }

        }

        // Move to previous step
        function previousStep(current) {

            document.getElementById("step" + current)
                .classList.remove("active");

            document.getElementById("step" + (current - 1))
                .classList.add("active");

        }

        // Final validation and summary
        function submitForm() {

            let password =
                document.getElementById("password").value;

            if (password.length < 6) {
                alert("Password must contain at least 6 characters");
                return;
            }

            document.getElementById("step3")
                .classList.remove("active");

            document.getElementById("summary")
                .classList.add("active");

            document.getElementById("result").innerHTML =
                "Name: " + document.getElementById("name").value +
                "<br>Email: " + document.getElementById("email").value;

        }

    </script>

</body>
</html>
