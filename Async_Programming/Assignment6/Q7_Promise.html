
<!DOCTYPE html>
<html>
<head>
    <title>Q7 - Lazy Loader</title>
</head>
<body>

    <h2>Dashboard Lazy Loader</h2>

    <script>

        // Load Profile
        function loadProfile() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve("Profile Loaded");
                }, 2000);
            });
        }

        // Load Posts
        function loadPosts() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve("Posts Loaded");
                }, 1500);
            });
        }

        // Load Messages
        function loadMessages() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {

                    // Randomly reject Promise
                    if (Math.random() < 0.5) {
                        reject("Messages Failed");
                    } else {
                        resolve("Messages Loaded");
                    }

                }, 1000);
            });
        }

        // Start time
        let startTime = Date.now();

        async function loadDashboard() {

            console.log("Dashboard Loading...");

            // Execute all Promises together
            let results = await Promise.allSettled([
                loadProfile(),
                loadPosts(),
                loadMessages()
            ]);

            // Display results
            results.forEach((result, index) => {

                let modules = [
                    "Profile",
                    "Posts",
                    "Messages"
                ];

                if (result.status === "fulfilled") {

                    console.log(
                        modules[index] + " Success: " +
                        result.value
                    );

                } else {

                    console.log(
                        modules[index] + " Failed: " +
                        result.reason
                    );

                }

            });

            // Calculate total time
            let endTime = Date.now();

            console.log(
                "Total Time: " +
                (endTime - startTime) + " ms"
            );

        }

        loadDashboard();

    </script>

</body>
</html>
