
<!DOCTYPE html>
<html>
<head>
    <title>Q4 - Server Response</title>
</head>
<body>
    <h2>DevOps Server Response</h2>

    <script>
        // Server A responds in 2 seconds
        function serverA() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {

                    if (Math.random() < 0.2) {
                        reject("Server A failed");
                    } else {
                        resolve("Server A completed");
                    }

                }, 2000);
            });
        }

        // Server B responds in 3 seconds
        function serverB() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {

                    if (Math.random() < 0.2) {
                        reject("Server B failed");
                    } else {
                        resolve("Server B completed");
                    }

                }, 3000);
            });
        }

        // Promise.all()
        Promise.all([serverA(), serverB()])
            .then((result) => {
                console.log("Deployment completed for all servers");
                console.log(result);
            })
            .catch((error) => {
                console.log("Deployment Error: " + error);
            });

        // Promise.race()
        Promise.race([serverA(), serverB()])
            .then((result) => {
                console.log("Fastest response: " + result);
            })
            .catch((error) => {
                console.log("Race Error: " + error);
            });

    </script>
</body>
</html>
