
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart Total</title>
</head>
<body>
    <h2>Shopping Cart</h2>

    <ul id="cartItems"></ul>

    <p id="subtotal"></p>

    <form id="couponForm">
        Enter Coupon:
        <input type="text" id="coupon">
        <button type="submit">Apply Coupon</button>
    </form>

    <p id="message"></p>
    <h3 id="finalTotal"></h3>

    <script>
        class Cart {
            constructor() {
                this.items = [];
            }

            addItem(name, price, quantity) {
                this.items.push({
                    name: name,
                    price: price,
                    quantity: quantity
                });
            }

            getTotal() {
                return this.items.reduce(function(total, item) {
                    return total + item.price * item.quantity;
                }, 0);
            }
        }

        let cart = new Cart();

        cart.addItem("Keyboard", 1500, 1);
        cart.addItem("Mouse", 500, 2);

        let list = document.getElementById("cartItems");

        cart.items.forEach(function(item) {
            let li = document.createElement("li");

            li.textContent = item.name + " - Price: " +
                item.price + " - Quantity: " + item.quantity;

            list.appendChild(li);
        });

        let total = cart.getTotal();

        document.getElementById("subtotal").textContent =
            "Subtotal: ₹" + total;

        document.getElementById("finalTotal").textContent =
            "Final Total: ₹" + total;

        document.getElementById("couponForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let coupon = document.getElementById("coupon").value.trim().toUpperCase();

            let couponPattern = /^(SAVE20|DISC10)$/;

            let message = document.getElementById("message");
            let finalTotal = document.getElementById("finalTotal");

            if (!couponPattern.test(coupon)) {
                message.style.color = "red";
                message.textContent = "Invalid coupon code.";
                finalTotal.textContent = "Final Total: ₹" + total;
            } else {
                let discount = 0;

                if (coupon === "SAVE20") {
                    discount = 20;
                } else if (coupon === "DISC10") {
                    discount = 10;
                }

                let discountedTotal =
                    total - (total * discount / 100);

                message.style.color = "green";
                message.textContent = discount + "% discount applied!";

                finalTotal.textContent =
                    "Final Total: ₹" + discountedTotal.toFixed(2);
            }
        });
    </script>
</body>
</html>
