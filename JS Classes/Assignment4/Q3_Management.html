
<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>
</head>
<body>
    <h2>Library Management System</h2>

    <label>Enter ISBN:</label>
    <input type="text" id="isbn">

    <button onclick="issueBook()">Issue Book</button>
    <button onclick="returnBook()">Return Book</button>

    <h3>Available Books</h3>
    <ul id="bookList"></ul>

    <p id="message"></p>

    <script>
        class Book {
            constructor(title, author, ISBN) {
                this.title = title;
                this.author = author;
                this.ISBN = ISBN;
                this.isIssued = false;
            }

            issueBook() {
                if (this.isIssued) {
                    return false;
                }

                this.isIssued = true;
                return true;
            }

            returnBook() {
                if (!this.isIssued) {
                    return false;
                }

                this.isIssued = false;
                return true;
            }
        }

        let books = [
            new Book("The Alchemist", "Paulo Coelho", "101"),
            new Book("Wings of Fire", "A.P.J. Abdul Kalam", "102"),
            new Book("The Hobbit", "J.R.R. Tolkien", "103")
        ];

        function displayBooks() {
            let list = document.getElementById("bookList");
            list.innerHTML = "";

            books.forEach(function(book) {
                if (!book.isIssued) {
                    let li = document.createElement("li");
                    li.textContent = book.title + " - " +
                        book.author + " - ISBN: " + book.ISBN;
                    list.appendChild(li);
                }
            });
        }

        function issueBook() {
            let isbn = document.getElementById("isbn").value;
            let book = books.find(function(b) {
                return b.ISBN === isbn;
            });

            let message = document.getElementById("message");

            if (!book) {
                message.textContent = "Book not found.";
            } else if (book.issueBook()) {
                message.textContent = "Book issued successfully.";
            } else {
                message.textContent = "Book is already issued.";
            }

            displayBooks();
        }

        function returnBook() {
            let isbn = document.getElementById("isbn").value;
            let book = books.find(function(b) {
                return b.ISBN === isbn;
            });

            let message = document.getElementById("message");

            if (!book) {
                message.textContent = "Book not found.";
            } else if (book.returnBook()) {
                message.textContent = "Book returned successfully.";
            } else {
                message.textContent = "Book was not issued.";
            }

            displayBooks();
        }

        displayBooks();
    </script>
</body>
</html>
