<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<style>
       .box{
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border: 2px solid black;
        }

        .bg-red{
            background-color: red;
            border-radius: 30px;
            padding: 30px;
        }
        .bg-blue{
            background-color: rgb(13, 0, 255);
            border-radius: 30px;
            padding: 30px;

        }
        .bg-green{
             background-color: rgb(0, 255, 64);
            border-radius: 30px;
            padding: 30px;
        }


</style>
<body>
    <!-- <h1 id="heading">Hello, world! understand DOM</h1>
    <button id="btn">Incrementer</button>
    <button id="bttn">Decrementer</button>
    <button id="bttnn">Reset</button> -->

      <div class="box ">

    </div>

    <button id="redBtn">red</button>
    <button id="blueBtn">blue</button>
    <button id="greenBtn">Green</button>

</body>
<script>

    const boxEl = document.querySelector(".box");
    const redBtnEl = document.querySelector("#redBtn");
    const blueBtnEl = document.querySelector("#blueBtn");
    const greenBtnEl = document.querySelector("#greenBtn");


    redBtnEl.addEventListener("click",()=>{
             
        boxEl.classList.remove("bg-blue")
        boxEl.classList.remove("bg-green")
       
        boxEl.classList.add("bg-red")
    })

    blueBtnEl.addEventListener("click",()=>{
        boxEl.classList.remove("bg-red")
        boxEl.classList.remove("bg-green")

        boxEl.classList.add("bg-blue")
    })

    greenBtnEl.addEventListener("click",()=>{

        boxEl.classList.remove("bg-red")
        boxEl.classList.remove("bg-blue")

        boxEl.classList.add("bg-green");

    })
</script>
</html>
