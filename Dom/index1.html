<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
</head>
<body>
    <h1>DOM Input</h1>
    <input id="inputName" type="text" placeholder="name">
    <button id="btn">add</button>
    <ul id="list">

    </ul>
    
</body>
<script>

    const inputEl=document.querySelector("#inputName");
    const btnEl = document.querySelector("#btn");
    const listEl = document.querySelector("#list")

    btnEl.addEventListener("click",()=>{
        let val = inputEl.value.trim();

        if(val === ""){
            alert("empty text not allowed")
            return;
        }

        // create li element

        // let l1EL = document.createElement("li");
        // l1EL.textContent=val;
        // listEl.appendChild(l1EL);
        
        // OR

        listEl.innerHTML += `<li>${val}</li>`

        inputEl.value=""; 
    })

</script>
</html>
