
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white text-center py-5">
    <h1>Tech Journal</h1>
    <p class="lead">Articles and Insights</p>
</header>

<main class="container py-5">

    <article class="bg-white rounded p-4 mb-4 shadow-sm">
        <h2>Responsive Web Design</h2>
        <p>Responsive design allows websites to adapt to different screen sizes.</p>
    </article>

    <article class="bg-white rounded p-4 mb-4 shadow-sm">
        <h2>Introduction to Bootstrap</h2>
        <p>Bootstrap provides reusable components and responsive utilities.</p>
    </article>

    <nav>
        <ul class="pagination justify-content-center">
            <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>

    <div class="d-flex justify-content-between">
        <button class="btn btn-outline-secondary">Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts</button>
    </div>

</main>

</body>
</html>
