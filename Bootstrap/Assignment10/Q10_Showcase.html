
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-dark text-white text-center py-5">
    <h1>Explore the World</h1>
    <p class="lead">Your journey begins here</p>
</header>

<main class="container py-5">

    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button data-bs-target="#travelCarousel" data-bs-slide-to="0" class="active"></button>
            <button data-bs-target="#travelCarousel" data-bs-slide-to="1"></button>
            <button data-bs-target="#travelCarousel" data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://picsum.photos/id/1015/1200/500" class="d-block w-100" alt="Mountains">
                <div class="carousel-caption">
                    <h2>Mountain Adventure</h2>
                    <p>Explore beautiful mountains.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/id/1018/1200/500" class="d-block w-100" alt="Nature">
                <div class="carousel-caption">
                    <h2>Nature Escape</h2>
                    <p>Enjoy peaceful surroundings.</p>
                </div>
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/id/1036/1200/500" class="d-block w-100" alt="Travel">
                <div class="carousel-caption">
                    <h2>Explore New Places</h2>
                    <p>Create unforgettable memories.</p>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" data-bs-target="#travelCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" data-bs-target="#travelCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <section class="mt-5">
        <div class="d-flex justify-content-between">
            <h2>Booking Completion</h2>
            <strong>70%</strong>
        </div>

        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%">
                70%
            </div>
        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center py-4">
    <p>Email: travel@example.com</p>
    <p>Phone: +91 98765 43210</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
