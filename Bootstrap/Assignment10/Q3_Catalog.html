
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white text-center py-5">
    <h1>SmartStore</h1>
    <p>Featured Products</p>
</header>

<main class="container py-5">
    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <img src="https://picsum.photos/id/1/400/250" class="card-img-top" alt="Laptop">
                <div class="card-body">
                    <h5>Laptop</h5><p>₹55,000</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <img src="https://picsum.photos/id/20/400/250" class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5>Headphones</h5><p>₹2,500</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <img src="https://picsum.photos/id/96/400/250" class="card-img-top" alt="Camera">
                <div class="card-body">
                    <h5>Camera</h5><p>₹38,000</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <img src="https://picsum.photos/id/160/400/250" class="card-img-top" alt="Watch">
                <div class="card-body">
                    <h5>Smart Watch</h5><p>₹4,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center p-3">© 2026 SmartStore</footer>
</body>
</html>
