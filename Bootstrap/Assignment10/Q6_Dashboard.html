
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white p-4">
    <div class="container">
        <h1>Notifications Dashboard</h1>
    </div>
</header>

<main class="container py-5">
    <div class="alert alert-success">Success: Profile updated.</div>
    <div class="alert alert-info">Info: New resource available.</div>
    <div class="alert alert-danger">Warning: Subscription expires soon.</div>

    <div class="alert alert-warning alert-dismissible fade show">
        <strong>Reminder:</strong> Complete your pending tasks.
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="bg-white border rounded p-4">
        <h2>Summary</h2>
        <p>You have 3 notifications and 2 pending tasks.</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
