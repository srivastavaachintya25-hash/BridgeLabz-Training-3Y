
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white p-4">
    <div class="container d-flex justify-content-between">
        <h1 class="h3">Task Tracker</h1>
        <span class="badge bg-warning text-dark fs-6">Pending: 4</span>
    </div>
</header>

<main class="container py-5">
    <div class="list-group">
        <div class="list-group-item d-flex justify-content-between">
            Complete assignment <span class="badge bg-danger">High</span>
        </div>
        <div class="list-group-item d-flex justify-content-between">
            Review project <span class="badge bg-warning text-dark">Medium</span>
        </div>
        <div class="list-group-item d-flex justify-content-between">
            Read documentation <span class="badge bg-success">Low</span>
        </div>
        <div class="list-group-item d-flex justify-content-between">
            Push code to GitHub <span class="badge bg-danger">High</span>
        </div>
    </div>

    <button class="btn btn-success mt-4">
        Completed <span class="badge bg-light text-success">2</span>
    </button>
</main>

</body>
</html>
