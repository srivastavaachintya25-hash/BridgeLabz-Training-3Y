
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-danger text-white text-center py-5">
    <h1>Spice Garden</h1>
    <p class="lead">Today's Menu</p>
</header>

<main class="container py-5">
    <div class="row g-4">

        <div class="col-lg-7">
            <h2>Menu Items</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr><th>Item</th><th>Category</th><th>Price</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Paneer Tikka</td><td>Starter</td><td>₹220</td></tr>
                        <tr><td>Veg Biryani</td><td>Main Course</td><td>₹260</td></tr>
                        <tr><td>Butter Naan</td><td>Bread</td><td>₹60</td></tr>
                        <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹100</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-5">
            <img src="https://picsum.photos/600/400" class="img-fluid rounded" alt="Food">
            <h3 class="mt-3">Chef's Specials</h3>
            <ul class="list-group">
                <li class="list-group-item">Malai Paneer Tikka</li>
                <li class="list-group-item">Special Veg Thali</li>
                <li class="list-group-item">Chocolate Brownie</li>
            </ul>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center p-3">© 2026 Spice Garden</footer>
</body>
</html>
