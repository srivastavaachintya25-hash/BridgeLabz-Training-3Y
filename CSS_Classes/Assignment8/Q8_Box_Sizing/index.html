<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <h1>Box-Sizing Comparison</h1>

        <section class="comparison">

            <article class="box content-box">

                <h2>Content-Box</h2>

                <p>
                    Width excludes padding and border.
                    The total size becomes larger than
                    the declared width.
                </p>

            </article>

            <article class="box border-box">

                <h2>Border-Box</h2>

                <p>
                    Width includes padding and border.
                    The total size remains equal to
                    the declared width.
                </p>

            </article>

        </section>

    </main>

</body>
</html>
