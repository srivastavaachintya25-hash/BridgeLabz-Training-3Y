<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Selectors Practice</h1>
    </header>

    <main>
        <p>This paragraph demonstrates the element selector.</p>

        <p class="highlight">
            This paragraph uses a class selector.
        </p>

        <p id="special">
            This paragraph uses an ID selector.
        </p>

        <input type="text" placeholder="Attribute selector input">

        <ul class="list">
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ul>

        <div class="parent">
            <p>Descendant selector example</p>
            <span>Direct child example</span>
        </div>

        <a href="#">Link example</a>
    </main>

    <footer>
        <p>Selector practice using HTML and CSS</p>
    </footer>

</body>
</html>
