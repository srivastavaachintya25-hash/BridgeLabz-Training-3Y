<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the effect.</p>
    </header>

    <main class="gallery">

        <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Mountain landscape">
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
                 alt="Ocean view">
            <figcaption>Ocean View</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                 alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                 alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600"
                 alt="Snow mountains">
            <figcaption>Snow Mountains</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=600"
                 alt="Nature">
            <figcaption>Nature View</figcaption>
        </figure>

    </main>

</body>
</html>
