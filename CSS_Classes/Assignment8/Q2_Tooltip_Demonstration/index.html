<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <h1>Tooltip Demonstration</h1>

        <p>Hover over each item to view its tooltip.</p>

        <section class="tooltip-row">

            <div class="tooltip-box">
                HTML
                <span class="tooltip">
                    Structure of a webpage
                </span>
            </div>

            <div class="tooltip-box">
                CSS
                <span class="tooltip">
                    Styles a webpage
                </span>
            </div>

            <div class="tooltip-box">
                Flexbox
                <span class="tooltip">
                    One-dimensional layout
                </span>
            </div>

            <div class="tooltip-box">
                Grid
                <span class="tooltip">
                    Two-dimensional layout
                </span>
            </div>

        </section>

    </main>

</body>
</html>
