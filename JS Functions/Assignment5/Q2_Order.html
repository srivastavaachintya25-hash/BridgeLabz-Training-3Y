
<!DOCTYPE html>
<html>
<head>
    <title>Q2 Apply Operation</title>
</head>
<body>

    <h2>Apply Operation</h2>

    <script>
        function applyOperation(numbers, operation) {
            let result = [];

            for (let i = 0; i < numbers.length; i++) {
                result.push(operation(numbers[i]));
            }

            return result;
        }

        function double(num) {
            return num * 2;
        }

        function square(num) {
            return num * num;
        }

        let numbers = [1, 2, 3, 4];

        console.log("Double:", applyOperation(numbers, double));
        console.log("Square:", applyOperation(numbers, square));
    </script>

</body>
</html>
