
<!DOCTYPE html>
<html>
<head>
    <title>Q1 Callback</title>
</head>
<body>

    <h2>Callback Function</h2>

    <script>
        function greetUser(name, callback) {
            console.log("Hello " + name);
            callback();
        }

        function showEndMessage() {
            console.log("Welcome to the course!");
        }

        greetUser("Achintya", showEndMessage);
    </script>

</body>
</html>
